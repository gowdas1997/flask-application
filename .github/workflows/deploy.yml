name: CI/CD Pipeline

on:
  push:
    branches: [dev, main]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set namespace based on branch
        id: vars
        run: |
          if [ "${{ github.ref_name }}" == "dev" ]; then
            echo "namespace=dev" >> $GITHUB_OUTPUT
          else
            echo "namespace=prod" >> $GITHUB_OUTPUT
          fi

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t gowdas1997/flask-redis-app:latest .
          docker push gowdas1997/flask-redis-app:latest

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/${{ steps.vars.outputs.namespace }}/ -n ${{ steps.vars.outputs.namespace }}
          kubectl rollout restart deployment/flask-app -n ${{ steps.vars.outputs.namespace }}
          kubectl rollout restart deployment/redis -n ${{ steps.vars.outputs.namespace }}
          kubectl rollout status deployment/flask-app -n ${{ steps.vars.outputs.namespace }} --timeout=120s

      - name: Expose service via port-forward
        run: |
          NAMESPACE=${{ steps.vars.outputs.namespace }}
          if [ "$NAMESPACE" == "dev" ]; then
            PORT=8080
          else
            PORT=8081
          fi
          pkill -f "port-forward.*$NAMESPACE.*$PORT:80" || true
          sleep 2
          setsid nohup kubectl port-forward --address 0.0.0.0 svc/flask-app-service -n $NAMESPACE $PORT:80 > /tmp/portforward-$NAMESPACE.log 2>&1 < /dev/null &
          sleep 3
          echo "Port-forward started for $NAMESPACE on port $PORT"

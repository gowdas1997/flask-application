name: CI/CD Pipeline

on:
  push:
    branches: [dev, main]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set namespace based on branch
        id: vars
        run: |
          if [ "${{ github.ref_name }}" == "dev" ]; then
            echo "namespace=dev" >> $GITHUB_OUTPUT
          else
            echo "namespace=prod" >> $GITHUB_OUTPUT
          fi

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t gowdas1997/flask-redis-app:latest .
          docker push gowdas1997/flask-redis-app:latest

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/${{ steps.vars.outputs.namespace }}/ -n ${{ steps.vars.outputs.namespace }}
          kubectl rollout restart deployment/flask-app -n ${{ steps.vars.outputs.namespace }}
          kubectl rollout restart deployment/redis -n ${{ steps.vars.outputs.namespace }}
          kubectl rollout status deployment/flask-app -n ${{ steps.vars.outputs.namespace }} --timeout=120s

      - name: Restart port-forward service
        run: |
          NAMESPACE=${{ steps.vars.outputs.namespace }}
          sudo systemctl restart portforward-$NAMESPACE
          sleep 3
          sudo systemctl status portforward-$NAMESPACE --no-pager

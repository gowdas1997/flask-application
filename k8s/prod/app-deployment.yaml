apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: gowdas1997/flask-redis-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: app-config
---
apiVersion: v1
kind: Service
metadata:
  name: flask-app-service
  namespace: prod
spec:
  selector:
    app: flask-app
  ports:
    - port: 80
      targetPort: 5000
  type: NodePort
